# LiveClipper — production-oriented compose stack.
# For local development with hot-reload, override with a docker-compose.dev.yml.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  liveclipper:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: liveclipper/backend:latest
    container_name: liveclipper-backend
    restart: unless-stopped
    networks: [liveclipper]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      TZ: UTC
    volumes:
      # Persistent output + working data (host-visible).
      - ./backend/clips:/app/clips
      - ./backend/shorts:/app/shorts
      - ./backend/imports:/app/imports
      - ./backend/.buffer:/app/.buffer
      - ./backend/logs:/app/logs
      # Runtime-written state files. Pre-create on the host so Docker doesn't
      # materialize them as directories.
      - ./backend/highlights.jsonl:/app/highlights.jsonl
      - ./backend/.youtube_tokens.json:/app/.youtube_tokens.json
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 1g
    # Healthcheck is defined in the Dockerfile — no duplication here.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: liveclipper/frontend:latest
    container_name: liveclipper-frontend
    restart: unless-stopped
    networks: [liveclipper]
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 32m
