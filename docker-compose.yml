services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liveclipper-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Source code (dev hot-reload)
      - ./backend/app:/app/app
      - ./backend/run.py:/app/run.py
      # Persistent data
      - ./backend/.env:/app/.env
      - ./backend/clips:/app/clips
      - ./backend/shorts:/app/shorts
      - ./backend/.buffer:/app/.buffer
      - ./backend/highlights.jsonl:/app/highlights.jsonl
      - ./backend/.youtube_tokens.json:/app/.youtube_tokens.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liveclipper-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy