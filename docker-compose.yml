services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liveclipper-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/run.py:/app/run.py
      - ./backend/clips:/app/clips
      - ./backend/shorts:/app/shorts
      - ./backend/.buffer:/app/.buffer
      - ./backend/highlights.jsonl:/app/highlights.jsonl
      - ./backend/.youtube_tokens.json:/app/.youtube_tokens.json
      - ./backend/.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liveclipper-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
